# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/modelkit/webserver.pid;
error_log /var/log/sdkwork/modelkit/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name modelkit-dev.sdkwork.com modelkit-dev.birdcoder.com modelkit-dev.dtupay.com modelkit-dev.sdkwork.cn modelkit-dev.birdcoder.cn modelkit-dev.dtupay.cn modelkit-dev.skubc.com modelkit-dev.skubc.cn modelkit-dev.zowalk.com modelkit-dev.zowalk.cn modelkit-dev.offer86.com modelkit-dev.offer86.cn modelkit-dev.86offer.com modelkit-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
