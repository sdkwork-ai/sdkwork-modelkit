# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/modelkit/webserver.pid;
error_log /var/log/sdkwork/modelkit/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3901;
    }
    server {
        listen 80;
        server_name modelkit-staging.sdkwork.com modelkit-staging.birdcoder.com modelkit-staging.dtupay.com modelkit-staging.sdkwork.cn modelkit-staging.birdcoder.cn modelkit-staging.dtupay.cn modelkit-staging.skubc.com modelkit-staging.skubc.cn modelkit-staging.zowalk.com modelkit-staging.zowalk.cn modelkit-staging.offer86.com modelkit-staging.offer86.cn modelkit-staging.86offer.com modelkit-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
