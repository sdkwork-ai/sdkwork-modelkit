# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/modelkit/webserver.pid;
error_log /var/log/sdkwork/modelkit/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name modelkit-demo.sdkwork.com modelkit-demo.birdcoder.com modelkit-demo.dtupay.com modelkit-demo.noaper.com modelkit-demo.sdkwork.cn modelkit-demo.birdcoder.cn modelkit-demo.dtupay.cn modelkit-demo.noaper.cn modelkit-demo.skubc.com modelkit-demo.skubc.cn modelkit-demo.zowalk.com modelkit-demo.zowalk.cn modelkit-demo.offer86.com modelkit-demo.offer86.cn modelkit-demo.86offer.com modelkit-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/modelkit/web/static;
            index index.html;
            try_files $uri $uri/ =404;
        }
    }
}
